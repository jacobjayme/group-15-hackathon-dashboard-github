<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northstar Dashboard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <p class="kicker">Northstar</p>
    <h1 class="subheader">43North Matchmaking Dashboard</h1>
    <p class="subtitle">Mathcing startups to established companies for frictionless connections</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>Established Companies</h2>
        <div id="company-list" class="company-list"></div>
      </section>

      <section class="panel" id="matches-section" hidden>
        <h2>Candidate Matches</h2>
        <div id="match-list" class="match-list"></div>
      </section>
    </aside>

    <main class="detail" id="detail">
      <div class="empty-state">Select a company to see its top candidate matches.</div>
    </main>
  </div>

  <section class="browse">
    <button id="toggle-browse" class="browse-toggle" aria-expanded="false">
      Browse all startups <span id="browse-count"></span>
    </button>
    <div id="browse-panel" class="browse-panel" hidden>
      <input type="search" id="browse-search" class="browse-search" placeholder="Search by name or industry&hellip;">
      <div id="browse-list" class="browse-list"></div>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
